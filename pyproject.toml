[project]
name = "transcript-combobulator"
version = "0.4.1"
description = "Pre-processes audio files for better Whisper transcription"
readme = "docs/README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = []
authors = [
    { name = "Sean Kennedy", email = "sean@codeserious.com" }
]
# torch and torchaudio are an exact pair (torchaudio's wheel declares no
# dependencies, so pip will not enforce it). torchaudio 2.11 is its final
# maintenance line; 2.11.1 declares torch>=2.11. Nothing here calls torchaudio I/O, so
# torchcodec (ABI-locked to torch, no aarch64 wheel before 0.11) is not needed.
dependencies = [
    "openai-whisper==20250625",
    "python-dotenv==1.2.4",
    "soundfile==0.14.0",
    "torch==2.15.0",
    "torchaudio==2.11.1",
    "silero-vad==6.2.3",
    # silero-vad does not declare onnxruntime; its ONNX build needs it.
    "onnxruntime==1.31.1",
    "rich==15.0.0",
    # compare --wer: substitutions, deletions and insertions from a word alignment.
    "jiwer==4.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = [
    "pyrefly==1.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]
# Apple Silicon only; used when WHISPER_RUNTIME=mlx (the Apple GPU instead of the CPU).
mac = [
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # mlx-whisper does not pin mlx; this is the version every number in AGENTS.md was measured on.
    "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
combobulator = "transcript_combobulator.cli:main"

[project.urls]
Homepage = "https://github.com/seriouslysean/transcript-combobulator"
Repository = "https://github.com/seriouslysean/transcript-combobulator.git"
Issues = "https://github.com/seriouslysean/transcript-combobulator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcript_combobulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
pythonpath = ["."]
markers = [
    "slow: real whisper or VAD inference; needs models/ (about 20 s on Apple Silicon)",
    "mlx: real MLX inference; needs mlx_whisper and the mlx checkpoint, opt-in: make test-mlx",
]

[tool.uv]
# `uv sync --locked` installs from uv.lock. Plain `pip install` still works from
# the pins above, and that is how runewright's transcriber builds the package.

# CPU-only torch on Linux: PyPI's Linux wheels bundle CUDA. macOS uses PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pyrefly]
project-includes = ["transcript_combobulator"]
# No python_version pin: numpy's stubs use PEP 695 syntax, so checking as 3.11
# fails to parse them. pyrefly checks against the venv interpreter instead.
# The `mac` extra (mlx, mlx-whisper, and huggingface_hub through them) is not in
# the dev install, so its imports are untyped here.
ignore-missing-imports = ["mlx", "mlx.*", "mlx_whisper", "mlx_whisper.*", "huggingface_hub", "huggingface_hub.*"]

# _speech_regions_from_probs is a verbatim port of silero-vad; its int()
# calls stay so the port can be diffed against upstream.
[[tool.pyrefly.sub-config]]
matches = "transcript_combobulator/vad.py"
[tool.pyrefly.sub-config.errors]
unnecessary-type-conversion = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Ruff's classic default set (pycodestyle errors, pyflakes) plus import sorting,
# which replaces the old isort config.
select = ["E4", "E7", "E9", "F", "I"]
